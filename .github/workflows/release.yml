name: Release

# Publishing is tag-driven. Pushing a semver tag builds the site, deploys it to
# the S3 bucket behind CloudFront that serves www.macquery.in, and cuts a
# GitHub Release.
#
#   npm run release:patch     # or release:minor / release:major
#
# Stable tags (v1.2.3) deploy to production. Pre-release tags (v1.2.3-beta.1)
# are built and published as a GitHub pre-release but deliberately do NOT
# deploy — a pre-release should never silently become the live site.
#
# Merging to main does not publish. That is intentional: the version bump is an
# explicit decision, which is the whole point of semver.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the current ref to production'
        type: boolean
        default: false

permissions:
  contents: read

# Never let two deployments race. Not cancel-in-progress: a half-finished
# deploy is worse than a queued one.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      is_prerelease: ${{ steps.semver.outputs.is_prerelease }}
      should_deploy: ${{ steps.semver.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate semver and compare with package.json
        id: semver
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_DEPLOY: ${{ inputs.deploy }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run on $REF_NAME."
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "should_deploy=$MANUAL_DEPLOY" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # semver.org's own suggested regex, applied to the tag minus its "v".
          # The spec is explicit that "v1.2.3" is a tag name, not a semantic
          # version — "1.2.3" is the version.
          VERSION="${REF_NAME#v}"
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'

          if ! printf '%s' "$VERSION" | grep -Eq "$SEMVER_RE"; then
            echo "::error::Tag '$REF_NAME' is not valid semver. Expected vMAJOR.MINOR.PATCH, e.g. v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi

          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::Tag is $VERSION but package.json says $PKG_VERSION. Run 'npm run release:<patch|minor|major>' so the two cannot drift."
            exit 1
          fi

          # A hyphen after the patch number is what makes it a pre-release.
          if printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-'; then
            IS_PRE=true
            DEPLOY=false
            echo "Pre-release $VERSION — building and publishing, not deploying."
          else
            IS_PRE=false
            DEPLOY=true
            echo "Stable release $VERSION — will deploy to production."
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRE" >> "$GITHUB_OUTPUT"
          echo "should_deploy=$DEPLOY" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # The site is served from the root of www.macquery.in, so the default
        # base of '/' is correct. VITE_BASE exists for the case where it is
        # ever served from a subpath instead.
        env:
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to S3 and CloudFront
    needs: [verify, build]
    if: needs.verify.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC; harmless when using access keys
    environment:
      name: production
      url: https://www.macquery.in/
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Check deployment secrets are present
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}
          DISTRIBUTION: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          REGION: ${{ secrets.AWS_REGION }}
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$BUCKET" ]       || missing+=(S3_BUCKET)
          [ -n "$DISTRIBUTION" ] || missing+=(CLOUDFRONT_DISTRIBUTION_ID)
          [ -n "$REGION" ]       || missing+=(AWS_REGION)
          [ -n "$ROLE" ] || [ -n "$KEY_ID" ] || missing+=("AWS_ROLE_ARN or AWS_ACCESS_KEY_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. See RELEASING.md."
            exit 1
          fi

      - name: Configure AWS credentials
        # Prefers OIDC. If AWS_ROLE_ARN is unset the action falls back to the
        # static access key pair, so either setup works without editing this.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync hashed assets
        # Vite fingerprints everything under /assets, so those filenames change
        # whenever their contents do and can be cached indefinitely. --delete
        # is filtered by the excludes, so it will not touch the entry points.
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          aws s3 sync dist/ "s3://${BUCKET}" --delete \
            --exclude "*.html" --exclude "robots.txt" --exclude "sitemap.xml" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Sync entry points
        # These keep stable names, so they must revalidate or visitors keep
        # getting the old index.html pointing at assets that no longer exist.
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          aws s3 sync dist/ "s3://${BUCKET}" \
            --exclude "*" --include "*.html" --include "robots.txt" --include "sitemap.xml" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        # One wildcard path counts as a single invalidation, which stays inside
        # the free monthly allowance at any sane release cadence.
        env:
          DISTRIBUTION: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $ID created; waiting for it to complete."
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION" --id "$ID"

      - name: Verify the live site is serving this build
        run: |
          set -euo pipefail
          EXPECTED=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          echo "Expecting live site to reference $EXPECTED"
          for i in $(seq 1 10); do
            if curl -sf https://www.macquery.in/ | grep -q "$EXPECTED"; then
              echo "Live site is serving this build."
              exit 0
            fi
            sleep 15
          done
          echo "::error::www.macquery.in is not serving $EXPECTED after the invalidation completed."
          exit 1

  release:
    name: Publish GitHub Release
    needs: [verify, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          FLAGS=(--generate-notes --title "$TAG")
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" "${FLAGS[@]}" --repo "$GITHUB_REPOSITORY"
