name: CI

# Every pull request and every push to main is linted and built. Nothing here
# deploys — publishing is driven by semver tags, see release.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Non-blocking for now: main carries 26 pre-existing lint errors (unused
      # `motion` imports, mostly). Once those are cleared, drop
      # continue-on-error so lint regressions actually fail the build.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
